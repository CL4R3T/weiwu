services:
  db:
    image: postgres:18
    restart: unless-stopped
    ports:
      - "127.0.0.1:5532:5432"
    volumes:
      - /data/weiwu-db-1/data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  weiwu:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    init: true

  proxy:
    image: metacubex/mihomo:latest
    restart: unless-stopped
    volumes:
      - /etc/weiwu-mihomo:/root/.config/mihomo